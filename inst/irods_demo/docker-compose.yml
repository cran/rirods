name: irods-demo

services:
    irods-catalog:
        build:
            context: irods_catalog
        # 5432 is exposed by default and can conflict with other postgres containers.
        # When the metalnx-db service is no longer needed, this stanza can be removed.
        ports:
            - "5430:5432"
        environment:
            - POSTGRES_PASSWORD=testpassword
        restart: always

    irods-catalog-provider:
        build:
            context: irods_catalog_provider
        shm_size: 500mb
        healthcheck:
            test: ["CMD", "su", "-", "irods", "-c", 'echo -e "\x00\x00\x00\x33<MsgHeader_PI><type>HEARTBEAT</type></MsgHeader_PI>" | (exec 3<>/dev/tcp/127.0.0.1/1247; cat >&3; cat <&3; exec 3<&-)']
            interval: 10s
            timeout: 10s
            retries: 3
            start_period: 20s
            start_interval: 10s
        restart: always
        depends_on:
            - irods-catalog
            - minio

    irods-catalog-consumer:
        build:
            context: irods_catalog_consumer
        shm_size: 500mb
        healthcheck:
            test: ["CMD", "su", "-", "irods", "-c", 'echo -e "\x00\x00\x00\x33<MsgHeader_PI><type>HEARTBEAT</type></MsgHeader_PI>" | (exec 3<>/dev/tcp/127.0.0.1/1247; cat >&3; cat <&3; exec 3<&-)']
            interval: 10s
            timeout: 10s
            retries: 3
            start_period: 20s
            start_interval: 10s
        restart: always
        depends_on:
            irods-catalog-provider:
                condition: service_healthy

    irods-client-icommands:
        build:
            context: irods_client_icommands
        depends_on:
            irods-catalog-provider:
                condition: service_healthy

    irods-client-s3-api:
        image: irods/irods_s3_api:0.5.0
        volumes:
            - ./irods_client_s3_api/config.json:/config.json:ro
            - ./irods_client_s3_api/bucket_mappings.json:/bucket_mappings.json:ro
            - ./irods_client_s3_api/user_mappings.json:/user_mappings.json:ro
        ports:
            - "9002:9000"
        restart: on-failure
        depends_on:
            irods-catalog-provider:
                condition: service_healthy
